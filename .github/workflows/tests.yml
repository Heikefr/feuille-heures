# TESTS AUTOMATIQUES
# ------------------
# À chaque envoi de code sur GitHub (toutes les branches), ce fichier demande à GitHub de :
#   1. récupérer le dépôt ;
#   2. installer le navigateur de test (Chromium, piloté par Playwright) ;
#   3. lancer tous les tests du dossier tests/ : calculs, compteurs, compta, fiche, écrans iPhone et PC.
# Si un test échoue, les images « avant / après » du jeu de données inventé sont jointes au rapport.
#
# PUBLICATION : quand le code arrive sur la branche main ET que tous les tests passent, le site est publié
# sur GitHub Pages (seconde tâche, « publier »). Un test rouge bloque donc la mise en ligne.
# Réglage nécessaire, une fois : Settings › Pages › Source = « GitHub Actions ».
#
# Les vraies données (historique, relevés) ne sont pas dans le dépôt : elles arrivent par le secret
# FH_DONNEES_PRIVEES (Settings › Secrets and variables › Actions). Sans ce secret, seuls les tests
# sur les données inventées tournent. Rien de personnel n'est écrit dans le journal ni dans les pièces jointes.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Un seul passage à la fois par branche : un nouvel envoi annule le précédent.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Calculs, fiche et écrans
    # Version d'Ubuntu fixée : mêmes polices et même rendu d'une fois sur l'autre.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer l'outillage de test (version fixée dans package.json)
        run: npm install --no-audit --no-fund

      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests
        env:
          FH_DONNEES_PRIVEES: ${{ secrets.FH_DONNEES_PRIVEES }}
        # La sortie est gardée dans un fichier pour le rapport d'échec ; le code de retour reste celui des tests.
        run: |
          set -o pipefail
          npm test 2>&1 | tee sortie-des-tests.txt

      - name: Afficher les tests échoués sur la page de l'exécution
        if: failure()
        run: node tests/outils/rapport.js sortie-des-tests.txt

      - name: Joindre les images en cas d'échec (données inventées uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-des-tests
          path: tests/resultats/
          if-no-files-found: ignore
          retention-days: 14

  publier:
    name: Publier sur GitHub Pages
    # Seulement pour la branche main, et seulement si la tâche « tests » a réussi.
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Seuls les fichiers de l'appli sont publiés (pas les tests, ni le script Google, ni l'outillage).
      - name: Rassembler les fichiers de l'appli
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icon-*.png js css _site/

      - name: Préparer l'envoi
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
