<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feuille d'heures</title>
<meta name="theme-color" content="#18212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Heures">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : appli une colonne façon pointeuse — en-tête semaine collant, journées en cartes-lignes, barre d'onglets en bas */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ee; --line:#cfd7e0;
  --fg:#16202b; --muted:#5b6876; --accent:#d9822b; --accent-fg:#1a1206;
  --matin:#c9761c; --matin-bg:#fbeedd;
  --soir:#4b55b5; --soir-bg:#e6e8fa;
  --journee:#16807a; --journee-bg:#dcf2ef;
  --abs:#6c7a89; --abs-bg:#e7ebef;
  --ok:#1f8a4c; --ok-bg:#dff3e6; --warn:#b4541a; --warn-bg:#fbe6d9;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 4px 14px rgba(22,32,43,.06);
  --paper:#FFFFDC; --paper2:#FFF9C2; --grid:#CFC690; --head:#DCDCD4; --headline:#9d9a86; --theo:#8a8668; --pmuted:#6b6a5a;
  --note:#8a4fbf; --note-bg:#f0e4fa;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --note:#c79bf2; --note-bg:#352648;
  --paper:#26241a; --paper2:#302d1f; --grid:#4a4630; --head:#353324; --headline:#5d5940; --theo:#a8a27e; --pmuted:#aaa58a;
  --bg:#0f151c; --surface:#18212b; --sunk:#111920; --line:#2a3642;
  --fg:#e6ecf2; --muted:#93a1b0; --accent:#f0a04b; --accent-fg:#1a1206;
  --matin:#f0a04b; --matin-bg:#33261a; --soir:#9aa3ff; --soir-bg:#232744;
  --journee:#4fc6bd; --journee-bg:#163330; --abs:#9aa7b4; --abs-bg:#232d37;
  --ok:#5fd08e; --ok-bg:#163324; --warn:#f2995f; --warn-bg:#3a2417;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --note:#c79bf2; --note-bg:#352648;
  --paper:#26241a; --paper2:#302d1f; --grid:#4a4630; --head:#353324; --headline:#5d5940; --theo:#a8a27e; --pmuted:#aaa58a;
  --bg:#0f151c; --surface:#18212b; --sunk:#111920; --line:#2a3642;
  --fg:#e6ecf2; --muted:#93a1b0; --accent:#f0a04b; --accent-fg:#1a1206;
  --matin:#f0a04b; --matin-bg:#33261a; --soir:#9aa3ff; --soir-bg:#232744;
  --journee:#4fc6bd; --journee-bg:#163330; --abs:#9aa7b4; --abs-bg:#232d37;
  --ok:#5fd08e; --ok-bg:#163324; --warn:#f2995f; --warn-bg:#3a2417;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;align-items:center;gap:10px}
.wk-nav{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.wk-title{flex:1;min-width:0;text-align:center}
.wk-title b{font-family:var(--f-display);font-size:24px;letter-spacing:.02em;display:block;line-height:1.05}
.wk-title span{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.draft{background:var(--warn-bg);color:var(--warn)}
.chip.sent{background:var(--ok-bg);color:var(--ok)}

main{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
section{display:grid;gap:12px}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qlbl{flex:none;align-self:center;font-size:13px;font-weight:600;color:var(--muted);padding-right:2px}
.fiche-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;-webkit-overflow-scrolling:touch}
.snap{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.snap:last-child{border-bottom:0}
.snap b{font-size:14px}
.snap .btns{flex-wrap:nowrap}
.btn.danger{color:var(--warn)}
.ferie-note{font-size:12px;color:var(--warn);font-weight:600}
.qbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}

.days{display:grid}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.day:last-child{border-bottom:0}
.day[disabled]{cursor:default}
.dname{display:grid;line-height:1.1}
.dname b{font-family:var(--f-display);font-size:20px}
.dname span{font-size:12px;color:var(--muted)}
.dbody{min-width:0;display:grid;gap:3px}
.tag{justify-self:start;font-size:13px;font-weight:700;padding:2px 9px;border-radius:7px;white-space:nowrap}
.t-Matin{background:var(--matin-bg);color:var(--matin)}
.t-Soir{background:var(--soir-bg);color:var(--soir)}
.t-Journée{background:var(--journee-bg);color:var(--journee)}
.t-abs{background:var(--abs-bg);color:var(--abs)}
.t-off{background:transparent;color:var(--muted);font-weight:500;padding-left:0}
.dsub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dright{text-align:right;display:grid;gap:2px}
.dright b{font-family:var(--f-mono);font-size:17px;font-weight:600}
.dright span{font-size:12px;color:var(--muted)}
.moon{color:var(--soir)}

.sum{padding:14px;display:grid;gap:12px}
.meter{display:grid;gap:6px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter-top b{font-family:var(--f-mono);font-size:28px;font-weight:600}
.meter-top span{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b1{background:var(--journee)}
.bar .b2{background:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:10px;padding:9px 10px;display:grid;gap:1px}
.kv span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kv b{font-family:var(--f-mono);font-size:18px;font-weight:600}
.kv .hl{background:var(--ok-bg)}
.kv .hl b{color:var(--ok)}
.kv .neg{background:var(--warn-bg)}
.kv .neg b{color:var(--warn)}
.detail{font-size:13px;color:var(--muted);line-height:1.5}

.field{display:grid;gap:4px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=number],input[type=time],select,textarea{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px}
input[type=time]{font-family:var(--f-mono);min-height:42px}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad{padding:14px;display:grid;gap:12px}

.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--sunk);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

.banner{padding:11px 13px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--sunk);color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h b{font-family:var(--f-display);font-size:24px}
.grid-sched{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sbtn{border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;padding:9px 6px;display:grid;gap:1px;text-align:center}
.sbtn b{font-size:15px}
.sbtn span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.sbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent) inset}
.sbtn.m b{color:var(--matin)} .sbtn.s b{color:var(--soir)} .sbtn.j b{color:var(--journee)} .sbtn.a b{color:var(--abs)}
details{border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
details summary{padding:11px 12px;font-weight:600;font-size:14px;cursor:pointer}
details .pad{padding-top:0}

.ledger{display:grid}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:14px}
.lrow:last-child{border-bottom:0}
.lrow b{font-family:var(--f-display);font-size:17px}
.lrow .mono{text-align:right}
.pos{color:var(--ok)} .negc{color:var(--warn)}
.big{font-family:var(--f-mono);font-size:46px;font-weight:600;line-height:1}
.sched-edit{display:grid;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sched-edit:last-child{border-bottom:0}
.sched-edit .hd{display:flex;gap:8px;align-items:center}
.sched-edit .hd input{flex:1}
.sched-edit .hd select{width:auto}
.tiny{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.copyline{display:flex;gap:8px;align-items:center}
.copyline code{flex:1;min-width:0;font-family:var(--f-mono);font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (min-width:520px){.grid-sched{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* v1.3 fiche papier */
.wk-title{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}
.wk-title b i{font-style:normal;font-size:14px;color:var(--muted);margin-left:3px}
.paper{background:var(--paper);border:1.5px solid var(--headline);border-radius:4px;overflow:hidden}
.ph-h,.pc-h{background:var(--head);border-bottom:1.5px solid var(--headline);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pmuted)}
.ph-h{display:grid;grid-template-columns:48px 1fr 64px}.ph-h>div{padding:6px 7px;border-left:1px solid var(--grid)}.ph-h>div:first-child{border-left:0}
.prow{display:grid;grid-template-columns:48px 1fr 64px;border-bottom:1px solid var(--grid)}
.prow>div{padding:7px;border-left:1px solid var(--grid);min-width:0}.prow>div:first-child{border-left:0}
.prow.off{background:var(--paper2)}
.pday b{font-family:var(--f-display);font-size:19px;display:block;line-height:1}.pday span{font-size:11.5px;color:var(--pmuted)}
.pmid{display:grid;gap:5px}
.psel{width:100%;font-weight:700;font-size:14.5px;padding:5px 8px;border-radius:7px;border:1px solid var(--grid);background:var(--paper2);color:var(--fg);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
.psel.Matin{color:var(--matin)}.psel.Soir{color:var(--soir)}.psel.Journée{color:var(--journee)}.psel.abs{color:var(--abs)}.psel.off{color:var(--pmuted);font-weight:500}
.preal{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tin{font-family:var(--f-mono);font-size:14px;padding:3px 4px;border-radius:6px;border:1px solid var(--grid);background:var(--surface);color:var(--fg);min-height:30px;width:76px}
input.tin{width:96px;min-width:0;min-height:32px;padding:3px 6px;font-size:14px;border-radius:6px;background:var(--surface)}
.tin.chg{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ptheo{font-family:var(--f-mono);font-size:11.5px;color:var(--theo)}
.pinf{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--pmuted);flex-wrap:wrap}
.pinf b{font-family:var(--f-mono);font-weight:600}
.pinf label{display:inline-flex;gap:4px;align-items:center}
.pinf input[type=checkbox],.pcbx{width:16px;height:16px;accent-color:var(--ok);margin:0}
.more{border:1px solid var(--grid);background:var(--paper2);border-radius:6px;font-size:12px;font-weight:700;padding:2px 7px;color:var(--pmuted);margin-left:auto}
.prim{display:inline-flex;gap:3px}.prim i{font-style:normal;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--grid);border:1px solid var(--grid)}
.prim i.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.ptot{text-align:right;display:grid;align-content:center;gap:1px}.ptot b{font-family:var(--f-mono);font-size:16px}.ptot span{font-size:10.5px;color:var(--pmuted)}
.supp{color:var(--accent)}.nuit{color:var(--soir)}
.pnote{font-size:11.5px;font-weight:600;color:var(--warn)}
.pfoot{background:var(--head);border-top:1.5px solid var(--headline);display:grid;grid-template-columns:48px 1fr 64px;font-size:13px;font-weight:700}
.pfoot>div{padding:7px}.pfoot .r{text-align:right;font-family:var(--f-mono)}
.pcg{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles div{background:var(--paper);border:1px solid var(--grid);border-radius:10px;padding:7px 9px;display:grid}
.tiles span{font-size:11.5px;color:var(--pmuted)}.tiles b{font-family:var(--f-mono);font-size:17px}
.tiles .g{background:var(--ok-bg);border-color:transparent}.tiles .g b{color:var(--ok)}.tiles .n{background:var(--warn-bg);border-color:transparent}.tiles .n b{color:var(--warn)}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{border:1px solid var(--grid);background:var(--paper);border-radius:12px;padding:9px 2px;display:grid;justify-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--fg)}
.act svg{width:22px;height:22px}.act.p{background:var(--accent);border-color:transparent;color:var(--accent-fg)}.act[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent) inset}
.act:disabled{opacity:.45}
@media (min-width:900px){
 main .wrap{max-width:1180px}
 header.top .wrap{max-width:1180px}
 .pph{display:none}.pcg{display:block}
 .pc-h,.pcr{display:grid;grid-template-columns:100px 160px 150px 216px 90px 170px 92px minmax(150px,1fr)}
 .pc-h>div{padding:7px 8px 4px;border-left:1px solid var(--grid)}.pc-h>div:first-child{border-left:0}
 .pc-h small{display:grid;grid-template-columns:repeat(var(--n),1fr);font-size:10.5px;text-transform:none;letter-spacing:.02em;margin-top:3px}
 .pcr{border-bottom:1px solid var(--grid);align-items:stretch}.pcr.off{background:var(--paper2)}
 .pcr>div{border-left:1px solid var(--grid);padding:6px 8px;display:flex;align-items:center;gap:6px;min-width:0}.pcr>div:first-child{border-left:0;display:block}
 .g3{display:grid!important;grid-template-columns:repeat(3,1fr);text-align:center;font-family:var(--f-mono)}
 .pcr input.tin{flex:1;width:auto;min-width:104px;font-size:15px}
 .pcf{display:grid;grid-template-columns:100px 160px 150px 216px 90px 170px 92px minmax(150px,1fr);background:var(--head);border-top:1.5px solid var(--headline);font-weight:700}
 .pcf>div{padding:7px 8px;border-left:1px solid var(--grid)}.pcf>div:first-child{border-left:0}
 .wkbottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
 .pcf .mono{white-space:nowrap;font-size:12.5px}
 .pcr .pnote{white-space:normal}
 .pcr>div.pabs{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--pmuted);line-height:1.3}
 .pabs b{font-family:var(--f-mono);color:var(--fg);font-size:14px}
 .pabs .more{margin-left:0;flex:none}
}
/* v1.4 */
.wnote{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px dashed var(--headline);border-radius:10px;padding:5px 10px}
.wnote span{font-size:12px;font-weight:700;color:var(--note);text-transform:uppercase;letter-spacing:.05em}
.wnote input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;padding:5px 0;color:var(--fg)}
.wnote input:focus{outline:none}
.btn.paperbtn{background:var(--paper);border-color:var(--grid)}
.fiche-img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px}
.ech{display:grid}
.erow{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}

function week(k){k=k||S.cur;if(!S.weeks[k])S.weeks[k]={days:[{},{},{},{},{},{},{}],obs:"",validated:false};return S.weeks[k]}
function deepMerge(a,b){if(!b||typeof b!=="object")return a;Object.keys(b).forEach(function(k){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))deepMerge(a[k],b[k]);else a[k]=b[k]});return a}
function toast(m){S.toast=m;renderToast();clearTimeout(toast.t);toast.t=setTimeout(function(){S.toast=null;renderToast()},2600)}
function renderToast(){var el=document.getElementById("toast");if(el)el.remove();if(!S.toast)return;el=document.createElement("div");el.id="toast";el.className="toast";el.textContent=S.toast;document.body.appendChild(el)}

var timers={};

var KEY="feuille-heures-v1",KEY_BK="feuille-heures-backup";
function queue(){clearTimeout(timers.p);timers.p=setTimeout(persist,300)}
window.addEventListener("pagehide",function(){if(timers.p){clearTimeout(timers.p);persist()}});
document.addEventListener("visibilitychange",function(){if(document.hidden&&timers.p){clearTimeout(timers.p);persist()}});
function snapshot(){return{app:"feuille-heures",format:1,version:VERSION,exporte:new Date().toISOString().slice(0,16),settings:S.settings,weeks:S.weeks}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(snapshot()));return true}catch(e){toast("Impossible d'enregistrer sur cet appareil");return false}}
function applyData(d){if(!d||typeof d!=="object")throw new Error("format");if(d.settings)S.settings=deepMerge(defaultSettings(S.cur),d.settings);if(d.weeks&&typeof d.weeks==="object")S.weeks=d.weeks;migrate();applyTheme()}
function migrate(){var def={};defaultSettings("").horaires.forEach(function(h){def[h.id]=h});
  migrate14();
  (S.settings.horaires||[]).forEach(function(h){var dh=def[h.id];if(h.theo==null)h.theo=dh?dh.theo:420;if(h.fri&&h.fri.theo==null)h.fri.theo=dh&&dh.fri?dh.fri.theo:h.theo})}
function migrate14b(){if(S.settings.mig14b)return;var names={m1:"Matin 1",m2:"Matin 2",m3:"Matin 3",s2:"Soir 2",s3:"Soir 3",j:"Journée"};
  (S.settings.horaires||[]).forEach(function(h){if(names[h.id]&&h.label===names[h.id])h.label=""});
  Object.keys(S.weeks).forEach(function(k){(S.weeks[k].days||[]).forEach(function(d){if(d&&/^sch:/.test(d.type||"")&&names[d.type.slice(4)]===d.label)d.label=""})});
  S.settings.regles.hsCalc="semaine";S.settings.mig14b=true}
function migrateTypes(){Object.keys(S.weeks).forEach(function(k){(S.weeks[k]&&S.weeks[k].days||[]).forEach(function(d){if(d&&d.type==="conge")d.type="cp";if(d&&d.type==="cjour")d.type="csup"})})}

  loadLocal();migrate();applyTheme();S.ready=true;

var KEY_SYNC="feuille-heures-sync",SY=(function(){try{return JSON.parse(localStorage.getItem(KEY_SYNC))||{}}catch(e){return{}}})();
SY.meta=SY.meta||{};SY.dirty=SY.dirty||{};
function saveSync(){try{localStorage.setItem(KEY_SYNC,JSON.stringify(SY))}catch(e){}}
function touch(k){SY.meta[k]=Date.now();SY.dirty[k]=1;saveSync();if(SY.api){clearTimeout(touch.t);touch.t=setTimeout(syncNow,1500)}}
function markAllDirty(){var n=Date.now();SY.meta.settings=n;SY.dirty.settings=1;Object.keys(S.weeks).forEach(function(k){SY.meta["w:"+k]=n;SY.dirty["w:"+k]=1});saveSync();if(SY.api)syncNow()}
function docFor(k){return k==="settings"?S.settings:S.weeks[k.slice(2)]||null}
function applyRemote(it){if(it.k==="settings"){S.settings=deepMerge(defaultSettings(S.cur),it.d||{});migrate();applyTheme()}else if(it.k.indexOf("w:")===0&&it.d)S.weeks[it.k.slice(2)]=it.d;SY.meta[it.k]=it.t}
async function syncApi(action,payload){var r;
  if(action==="pull"){var u=new URL(SY.api);u.searchParams.set("action","pull");u.searchParams.set("cle",SY.cle);u.searchParams.set("since",payload.since||0);r=await fetch(u.toString())}
  else r=await fetch(SY.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action,cle:SY.cle},payload))});
  var j=await r.json();if(!j.ok)throw new Error(j.err||"Réponse refusée");return j}
var syncing=false;
async function syncNow(manual){if(!SY.api||syncing)return;syncing=true;var changed=false;
  try{var keys=Object.keys(SY.dirty);
    if(keys.length){var items=keys.map(function(k){return{k:k,t:SY.meta[k]||Date.now(),d:docFor(k)}});var j=await syncApi("push",{items:items});
      items.forEach(function(it){if(SY.meta[it.k]===it.t)delete SY.dirty[it.k]});
      (j.rejected||[]).forEach(function(it){if(!SY.dirty[it.k]){applyRemote(it);changed=true}})}
    var p=await syncApi("pull",{since:SY.last||0});
    (p.items||[]).forEach(function(it){if(SY.dirty[it.k])return;if(+it.t>(SY.meta[it.k]||0)){applyRemote(it);changed=true}});
    SY.last=Math.max(0,(p.now||0)-10000);SY.lastOk=Date.now();SY.err="";
  }catch(e){SY.err=String(e&&e.message||e)}
  finally{syncing=false;saveSync()}
  if(changed){persist();safeRender()}else if(S.tab==="set"&&S.setPage==="sync")safeRender();
  if(manual)toast(SY.err?"Synchronisation impossible : "+SY.err:"Synchronisé")}
function safeRender(){var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&app.contains(a)){clearTimeout(safeRender.t);safeRender.t=setTimeout(safeRender,2500);return}render()}
async function syncConnect(api,cle){if(!/^https:\/\/script\.google\.com\//.test(api)){toast("L'adresse doit commencer par https://script.google.com/");return}if(!cle){toast("Saisis le code d'accès");return}
  addSnap("Avant synchronisation",true);SY.api=api;SY.cle=cle;SY.last=0;SY.dirty={};
  try{var p=await syncApi("pull",{since:0}),remote={};
    (p.items||[]).forEach(function(it){remote[it.k]=1;applyRemote(it)});
    if(!remote.settings){SY.meta.settings=Date.now();SY.dirty.settings=1}
    Object.keys(S.weeks).forEach(function(k){if(!remote["w:"+k]){SY.meta["w:"+k]=Date.now();SY.dirty["w:"+k]=1}});
    SY.last=Math.max(0,(p.now||0)-10000);saveSync();persist();await syncNow();render();toast("Synchronisation activée")}
  catch(e){SY.api="";SY.cle="";saveSync();render();toast("Connexion impossible : "+(e&&e.message||e))}}

  var sentAt=fmtD(now)+"/"+now.getFullYear()+" à "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");

  var buf=await buildXlsx(w,c,mon,st,validate?sentAt:(w.sentAt||sentAt),w.validated?soldeAvant:soldeAvant+c.net);
  var name="Feuille_heures_S"+String(+S.cur.slice(6)).padStart(2,"0")+"_"+S.cur.slice(0,4)+(st.profil.nom?"_"+st.profil.nom.replace(/[^\wÀ-ÿ-]+/g,"_"):"")+".xlsx";
  var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

}
