:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ee; --line:#cfd7e0;
  --fg:#16202b; --muted:#5b6876; --accent:#d9822b; --accent-fg:#1a1206;
  --matin:#c9761c; --matin-bg:#fbeedd;
  --soir:#4b55b5; --soir-bg:#e6e8fa;
  --journee:#16807a; --journee-bg:#dcf2ef;
  --abs:#6c7a89; --abs-bg:#e7ebef;
  --ok:#1f8a4c; --ok-bg:#dff3e6; --warn:#b4541a; --warn-bg:#fbe6d9;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 4px 14px rgba(22,32,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}

body{margin:0}
[hidden]{display:none!important}

.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.wk-title{flex:1;min-width:0;text-align:center}
.wk-title b{font-family:var(--f-display);font-size:24px;letter-spacing:.02em;display:block;line-height:1.05}
.wk-title span{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.draft{background:var(--warn-bg);color:var(--warn)}
.chip.sent{background:var(--ok-bg);color:var(--ok)}

main{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
section{display:grid;gap:12px}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}

.ferie-note{font-size:12px;color:var(--warn);font-weight:600}
.qbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}

.days{display:grid}

.day:last-child{border-bottom:0}
.day[disabled]{cursor:default}
.dname{display:grid;line-height:1.1}
.dname b{font-family:var(--f-display);font-size:20px}
.dname span{font-size:12px;color:var(--muted)}
.dbody{min-width:0;display:grid;gap:3px}
.tag{justify-self:start;font-size:13px;font-weight:700;padding:2px 9px;border-radius:7px;white-space:nowrap}
.t-Matin{background:var(--matin-bg);color:var(--matin)}
.t-Soir{background:var(--soir-bg);color:var(--soir)}
.t-Journée{background:var(--journee-bg);color:var(--journee)}
.t-abs{background:var(--abs-bg);color:var(--abs)}
.t-off{background:transparent;color:var(--muted);font-weight:500;padding-left:0}
.dsub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dright{text-align:right;display:grid;gap:2px}
.dright b{font-family:var(--f-mono);font-size:17px;font-weight:600}
.dright span{font-size:12px;color:var(--muted)}
.moon{color:var(--soir)}

.sum{padding:14px;display:grid;gap:12px}
.meter{display:grid;gap:6px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter-top b{font-family:var(--f-mono);font-size:28px;font-weight:600}
.meter-top span{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b1{background:var(--journee)}
.bar .b2{background:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:10px;padding:9px 10px;display:grid;gap:1px}
.kv span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kv b{font-family:var(--f-mono);font-size:18px;font-weight:600}
.kv .hl{background:var(--ok-bg)}
.kv .hl b{color:var(--ok)}
.kv .neg{background:var(--warn-bg)}
.kv .neg b{color:var(--warn)}
.detail{font-size:13px;color:var(--muted);line-height:1.5}

.field{display:grid;gap:4px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=number],input[type=time],select,textarea{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px}
input[type=time]{font-family:var(--f-mono);min-height:42px}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pad{padding:14px;display:grid;gap:12px}

.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--sunk);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

.banner{padding:11px 13px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--sunk);color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h b{font-family:var(--f-display);font-size:24px}
.grid-sched{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sbtn{border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;padding:9px 6px;display:grid;gap:1px;text-align:center}
.sbtn b{font-size:15px}
.sbtn span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.sbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent) inset}
.sbtn.m b{color:var(--matin)} .sbtn.s b{color:var(--soir)} .sbtn.j b{color:var(--journee)} .sbtn.a b{color:var(--abs)}
details{border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
details summary{padding:11px 12px;font-weight:600;font-size:14px;cursor:pointer}
details .pad{padding-top:0}

.ledger{display:grid}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:14px}
.lrow:last-child{border-bottom:0}
.lrow b{font-family:var(--f-display);font-size:17px}
.lrow .mono{text-align:right}
.pos{color:var(--ok)} .negc{color:var(--warn)}
.big{font-family:var(--f-mono);font-size:46px;font-weight:600;line-height:1}
.sched-edit{display:grid;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sched-edit:last-child{border-bottom:0}
.sched-edit .hd{display:flex;gap:8px;align-items:center}
.sched-edit .hd input{flex:1}
.sched-edit .hd select{width:auto}
.tiny{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.copyline{display:flex;gap:8px;align-items:center}
.copyline code{flex:1;min-width:0;font-family:var(--f-mono);font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (min-width:520px){.grid-sched{grid-template-columns:repeat(4,minmax(0,1fr))}}

<script id="core">
/* ===== Calculs (purs) ===== */

function defaultSettings(curKey){return{

  regles:{seuil:2100,palier:480,taux1:25,taux2:50,nuit:100,nuitDebut:360,nuitFin:1200,panierMin:360,samTaux:50,maxJour:600,maxSem:2400,hsMode:"recup"},

    {id:"s3",label:"Soir 3",team:"Soir",start:765,end:1215,pause:0,theo:420,fri:null},
    {id:"j",label:"Journée",team:"Journée",start:420,end:930,pause:60,theo:450,fri:{start:420,end:720,pause:0,theo:300}}

function hm(m,signed){if(m==null||isNaN(m))return"";var s=m<0?"-":(signed&&m>0?"+":"");m=Math.round(Math.abs(m));return s+Math.floor(m/60)+":"+String(m%60).padStart(2,"0")}

function schedFor(st,id,idx){var h=null;st.horaires.forEach(function(x){if(x.id===id)h=x});if(!h)return null;

/* Jours fériés (France métropolitaine) */
function paques(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
var FER_CACHE={};
function feries(y){if(FER_CACHE[y])return FER_CACHE[y];var r={},P=paques(y);

  rel(39,"Ascension");rel(50,"Lundi de Pentecôte");add(new Date(y,6,14),"Fête nationale");add(new Date(y,7,15),"Assomption");

function ferieOf(d){return feries(d.getFullYear())[d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()]||null}
function isWork(d){return d&&(d.type==="perso"||/^sch:/.test(d.type||""))}
function dayCalc(d,idx,st){

function weekCalc(w,st){
  var R=st.regles,days=(w&&w.days)||[],t={days:[],worked:0,counted:0,night:0,panier:0,recupDays:0,x:{},sam:0,samedi:0,cjour:0,alertJours:0,greve:0,formation:0,conge:0,maladie:0,ferie:0,absence:0};

    EXTRAS.forEach(function(e){t.x[e[0]]+=c.x[e[0]]});
    if(c.abs==="recup")t.recupDays++;
    if(c.abs==="conge")t.conge+=c.counted;if(c.abs==="maladie")t.maladie+=c.counted;if(c.abs==="ferie")t.ferie+=c.counted;if(c.abs==="absence")t.absence++;
    t.greve+=c.greveJour+c.x.greve;t.formation+=c.formJour;}
  t.hs=Math.max(0,t.counted-R.seuil);
  t.hs1=Math.min(t.hs,R.palier);t.hs2=t.hs-t.hs1;
  t.majHs=t.hs1*R.taux1/100+t.hs2*R.taux2/100;
  t.majNuit=t.night*R.nuit/100;
  t.majSam=t.samedi*(+R.samTaux||0)/100;
  t.alertSem=t.worked>R.maxSem;
  t.recupMode=R.hsMode==="recup";
  t.gain=(t.recupMode?t.hs+t.majHs+t.samedi+t.majSam:0)+t.majNuit;
  t.debit=t.recupDays*(+st.comptes.recup||0);

/* Semaines ISO */
function mondayOf(dt){var d=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function keyOf(mon){var th=new Date(mon);th.setDate(th.getDate()+3);var y=th.getFullYear();var w1=mondayOf(new Date(y,0,4));var n=1+Math.round((mon-w1)/(7*864e5));return y+"-W"+String(n).padStart(2,"0")}
function monOfKey(k){var y=+k.slice(0,4),n=+k.slice(6);var d=mondayOf(new Date(y,0,4));d.setDate(d.getDate()+(n-1)*7);return d}
function shiftKey(k,n){var d=monOfKey(k);d.setDate(d.getDate()+7*n);return keyOf(d)}
function fmtD(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}
function congesCalc(st,weeks){var c=st.conges||{h:0,j:0,from:""},h=+c.h||0,j=+c.j||0;
  Object.keys(weeks).sort().forEach(function(k){var w=weeks[k];if(!w||!w.validated||k<(c.from||""))return;var x=weekCalc(w,st);h-=x.conge;j-=x.cjour});
  return{h:h,j:j}}
function soldeCalc(st,weeks){var s=st.solde||{min:0,from:""},tot=+s.min||0,rows=[];
  Object.keys(weeks).sort().forEach(function(k){var w=weeks[k];if(!w||!w.validated||k<(s.from||""))return;var c=weekCalc(w,st);tot+=c.net;rows.push({k:k,c:c,after:tot})});
  return{solde:tot,rows:rows}}
if(typeof module!=="undefined")module.exports={feries:feries,ferieOf:ferieOf,congesCalc:congesCalc,defaultSettings:defaultSettings,weekCalc:weekCalc,schedFor:schedFor,keyOf:keyOf,monOfKey:monOfKey,hm:hm,soldeCalc:soldeCalc};
</script>

app.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(!el)return;var a=el.dataset.act;
  if(a==="close"&&e.target!==el)return;
  if(["dset","xset","sset","hset","obs","xsam","hfri"].indexOf(a)>=0)return;
  var w=week();
  if(a==="tab"){S.tab=el.dataset.t;S.sheet=null;render();window.scrollTo(0,0)}
  else if(a==="wk"){S.cur=shiftKey(S.cur,+el.dataset.n);S.sheet=null;render()}
  else if(a==="openday"){S.sheet=+el.dataset.i;render()}
  else if(a==="close"){S.sheet=null;render()}
  else if(a==="prevday"){S.sheet=Math.max(0,S.sheet-1);render()}
  else if(a==="nextday"){S.sheet=Math.min(6,S.sheet+1);render()}
  else if(a==="pick"){var i=S.sheet,id=el.dataset.id,old=w.days[i]||{},d;
    if(id==="")d={x:old.x||{},noFerie:!!ferieOf(dayDate(S.cur,i))};else if(id==="perso")d={type:"perso",team:old.team||"Matin",start:old.start!=null?old.start:360,end:old.end!=null?old.end:795,pause:old.pause||0,x:old.x||{}};
    else if(ABS[id])d={type:id,x:old.x||{}};else d=applySched(i,id);
    setDay(i,d);render()}
  else if(a==="fill"){var nf=0;for(var i=0;i<5;i++){var od=w.days[i]||{};if(od.type==="ferie"){nf++;continue}w.days[i]=applySched(i,el.dataset.id)}saveWeek();render();toast(nf?"Lundi à vendredi remplis (férié conservé)":"Lundi à vendredi remplis")}
  else if(a==="copyprev"){var p=S.weeks[shiftKey(S.cur,-1)];if(!p){toast("Rien à copier dans la semaine précédente");return}
    w.days=JSON.parse(JSON.stringify(p.days));saveWeek();render();toast("Semaine précédente copiée")}
  else if(a==="clear"){w.days=[{},{},{},{},{},{},{}];saveWeek();render()}
  else if(a==="sendhtml")sendHtml(true);
  else if(a==="copyhtml")sendHtml(false);
  else if(a==="snapnew"){addSnap("Sauvegarde manuelle",false);render();toast("Sauvegarde créée dans l'appli")}
  else if(a==="snapexp")exportSnap(el.dataset.id);
  else if(a==="snaprest"){if(S.confirm!=="r"+el.dataset.id){S.confirm="r"+el.dataset.id;render();return}S.confirm=null;restoreSnap(el.dataset.id)}
  else if(a==="snapdel"){if(S.confirm!=="d"+el.dataset.id){S.confirm="d"+el.dataset.id;render();return}S.confirm=null;delSnap(el.dataset.id);render();toast("Sauvegarde supprimée")}
  else if(a==="reopen"){w.validated=false;saveWeek();render()}
  else if(a==="send"||a==="export")doExport(a==="send");
  else if(a==="copy"){var v=el.dataset.v;if(!v)return;var done=function(){toast("Copié")};
    try{navigator.clipboard.writeText(v).then(done,function(){selectCode(el)})}catch(x){selectCode(el)}}
  else if(a==="setsolde"){var raw=document.getElementById("c-val").value.trim(),neg=/^-/.test(raw),m=toMin(raw.replace(/^[-+]/,"").replace("h",":"));
    if(m==null&&/^\d+$/.test(raw.replace(/^[-+]/,"")))m=+raw.replace(/^[-+]/,"")*60;
    if(m==null){toast("Format attendu : 12:30");return}
    S.settings.solde={min:neg?-m:m,from:document.getElementById("c-wk").value};saveSettings();render();toast("Compteur mis à jour")}
  else if(a==="setconges"){var rh=document.getElementById("c-ch").value.trim(),mh=toMin(rh.replace(/^[-+]/,"").replace("h",":"));
    if(mh==null&&/^\d+$/.test(rh.replace(/^[-+]/,"")))mh=+rh.replace(/^[-+]/,"")*60;

  else if(a==="hadd"){S.settings.horaires.push({id:"h"+Date.now().toString(36),label:"Nouvel horaire",team:"Matin",start:360,end:795,pause:0,theo:420,fri:null});saveSettings();render()}
  else if(a==="backup")backup();

/* ----- Sauvegardes ----- */
var KEY_SNAPS="feuille-heures-snapshots",SNAP_MAX=15;
function fmtDT(iso){try{return new Date(iso).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}catch(e){return iso}}
function getSnaps(){try{return JSON.parse(localStorage.getItem(KEY_SNAPS)||"[]")}catch(e){return[]}}
function setSnaps(a){for(;;){try{localStorage.setItem(KEY_SNAPS,JSON.stringify(a));return true}catch(e){var i=-1;for(var j=a.length-1;j>=0;j--)if(a[j].auto){i=j;break}if(i<0&&a.length)i=a.length-1;if(i<0)return false;a.splice(i,1)}}}
function addSnap(label,auto){var a=getSnaps();a.unshift({id:Date.now().toString(36),date:new Date().toISOString(),label:label,auto:!!auto,data:snapshot()});
  while(a.length>SNAP_MAX){var k=-1;for(var j=a.length-1;j>=0;j--)if(a[j].auto){k=j;break}a.splice(k<0?a.length-1:k,1)}setSnaps(a)}
function findSnap(id){var r=null;getSnaps().forEach(function(s){if(s.id===id)r=s});return r}
function delSnap(id){setSnaps(getSnaps().filter(function(s){return s.id!==id}))}
function restoreSnap(id){var s=findSnap(id);if(!s)return;addSnap("Avant restauration",true);applyData(JSON.parse(JSON.stringify(s.data)));persist();render();toast("Sauvegarde du "+fmtDT(s.date)+" restaurée")}
function exportSnap(id){var s=id?findSnap(id):null,data=s?s.data:snapshot(),d=s?s.date:new Date().toISOString();
  var name="feuille-heures-sauvegarde-"+d.slice(0,10)+".json";
  shareFile(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),name,"Sauvegarde feuille d'heures").then(function(ok){if(ok){try{localStorage.setItem(KEY_BK,new Date().toISOString())}catch(e){}render();toast("Fichier de sauvegarde créé")}})}
function lastFileBackup(){try{return localStorage.getItem(KEY_BK)}catch(e){return null}}
function backupDue(){var b=lastFileBackup(),n=Object.keys(S.weeks).filter(function(k){return S.weeks[k]&&S.weeks[k].validated}).length;if(!n)return false;return!b||(Date.now()-new Date(b))>30*864e5}
function viewSnaps(){var a=getSnaps(),bk=lastFileBackup(),out='<h2>Sauvegardes</h2>';
  if(backupDue())out+='<div class="banner warn">Aucun fichier de sauvegarde depuis plus de 30 jours. Exporte-en un dans Fichiers ou iCloud Drive.</div>';
  out+='<div class="card pad"><div class="tiny">Les sauvegardes de la liste restent dans l\'appli : elles protègent d\'une erreur de saisie, pas d\'une suppression de l\'appli. Pour ça, exporte un fichier de temps en temps.</div>'+
    '<div class="tiny">Dernier fichier exporté : '+(bk?fmtDT(bk):'jamais')+'</div>'+
    '<div class="btns"><button class="btn" data-act="snapnew">Sauvegarder maintenant</button><button class="btn" data-act="snapexp" data-id="">Exporter un fichier</button></div>'+
    '<label class="btn" for="imp" style="text-align:center">Importer un fichier…</label><input type="file" id="imp" accept=".json,application/json" hidden></div>';
  out+='<div class="card">';
  if(!a.length)out+='<div class="snap"><span class="tiny">Aucune sauvegarde pour l\'instant. Une sauvegarde est créée automatiquement à chaque fiche validée.</span></div>';
  a.forEach(function(s){var nw=Object.keys((s.data&&s.data.weeks)||{}).length,cr=S.confirm==="r"+s.id,cd=S.confirm==="d"+s.id;
    out+='<div class="snap"><div><b>'+fmtDT(s.date)+'</b><div class="tiny">'+esc(s.label)+' · '+nw+' semaine(s)</div></div><div class="btns">'+
    '<button class="btn small'+(cr?' primary':'')+'" data-act="snaprest" data-id="'+s.id+'">'+(cr?'Confirmer ?':'Restaurer')+'</button>'+
    '<button class="btn small" data-act="snapexp" data-id="'+s.id+'" aria-label="Exporter">⤓</button>'+
    '<button class="btn small danger'+(cd?' primary':'')+'" data-act="snapdel" data-id="'+s.id+'" aria-label="Supprimer">'+(cd?'Supprimer ?':'✕')+'</button></div></div>'});
  out+='</div>';return out}

/* ----- Fiche dans le corps du mail ----- */
function h2m(m){if(!m&&m!==0)return"";m=Math.round(m);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function ficheHtml(w,c,st,sentAt,solde){var mon=monOfKey(S.cur),sun=new Date(mon);sun.setDate(sun.getDate()+6);
  var B="border:1px solid #000;",Y="background:#FFFFCC;",G="background:#D9D9D9;",F="font-family:Calibri,Arial,sans-serif;font-size:13px;color:#000;",C="text-align:center;",P="padding:3px 6px;";
  function td(v,s,a){return'<td'+(a||'')+' style="'+B+P+F+(s||'')+'">'+(v==null?'':v)+'</td>'}
  var days=w.days.map(function(d){return d||{}}),R=st.regles,rec=c.recupMode;
  function row(label,vals,tot,opt){opt=opt||{};var bg=opt.bg||Y,h='<tr>'+td(label,bg+(opt.bold?'font-weight:bold;':''),' colspan="2"');
    for(var i=0;i<7;i++)h+=td(vals[i]==null?'':vals[i],bg+C+(opt.bold?'font-weight:bold;':''));return h+td(tot==null?'':tot,bg+C+'font-weight:bold;')+'</tr>'}
  function vt(arr){return arr.map(function(v){return v?h2m(v):''})}
  function lbl(i){var d=days[i],dc=c.days[i];if(i>4&&dc.abs==="ferie")return'';return dc.abs?esc(dc.label):''}
  var h='<table cellspacing="0" cellpadding="0" style="border-collapse:collapse;'+F+'">';
  h+='<tr>'+td('<b style="font-size:17px">FICHE DE TRAVAIL &amp; ABSENCES</b>',G+C,' colspan="7"')+td('<b style="color:#833C0B">'+fmtD(mon)+' au '+fmtD(sun)+'</b>',G+C,' colspan="2"')+td('<b style="font-size:16px">'+sun.getFullYear()+'</b>',G+C)+'</tr>';

  h+='<tr>'+td('',Y,' colspan="2"');["L","M","M","J","V","S","D"].forEach(function(l){h+=td('<b style="font-size:16px">'+l+'</b>',Y+C)});h+=td('',Y)+'</tr>';

  for(i=0;i<7;i++)h+=td(isWork(days[i])?toTime(days[i].end):'<b>'+lbl(i)+'</b>',Y+C);h+=td('',Y)+'</tr>';
  h+=row('<b>Nombre total d\'heures de travail</b>',vt(c.days.map(function(x){return x.worked})),c.worked?h2m(c.worked):'',{});
  var hsTot=c.hs+c.samedi;

  h+=row('<b>HEURE DE NUIT</b>',vt(c.days.map(function(x){return x.night})),h2m(c.night),{bg:G});
  h+=row('Prime de panier 3001',c.days.map(function(x){return x.panier||''}),c.panier||'');
  h+=row('Prime d\'équipe 3008',c.days.map(function(x){return x.panier||''}),c.panier||'');
  h+=row('Indemnité de Samedi 3006',c.days.map(function(x){return x.sam||''}),c.sam||'');

  // bilan
  var bl=[["Total de la semaine (absences comprises)",h2m(c.counted)],["Heures sup ("+R.taux1+" % jusqu'à "+hm(R.seuil+R.palier)+", "+R.taux2+" % au-delà)",h2m(c.hs)+(c.hs2?' (dont '+h2m(c.hs2)+' à '+R.taux2+' %)':'')]];

  h+='</table>';
  if(sentAt)h+='<p style="'+F+'color:#555;font-style:italic">Envoyé le '+esc(sentAt)+'</p>';
  return h}
function ficheText(w,c,st){var lines=["FICHE DE TRAVAIL & ABSENCES – Semaine "+(+S.cur.slice(6))+" – "+st.profil.nom+" ("+st.profil.matricule+")"];
  for(var i=0;i<7;i++){var d=w.days[i]||{},dc=c.days[i],dt=dayDate(S.cur,i);if(isWork(d))lines.push(DAYL[i]+" "+fmtD(dt)+" : "+dc.team+" "+toTime(d.start)+"-"+toTime(d.end)+" = "+h2m(dc.worked)+(dc.night?" (nuit "+h2m(dc.night)+")":""));else if(dc.abs&&!(i>4&&dc.abs==="ferie"))lines.push(DAYL[i]+" "+fmtD(dt)+" : "+dc.label)}
  lines.push("Total travaillé : "+h2m(c.worked)+" · Heures sup : "+h2m(c.hs+c.samedi)+" · Nuit : "+h2m(c.night)+" · Majoration : "+h2m(c.majHs+c.majSam)+" · Primes panier/équipe : "+c.panier);
  if(w.obs)lines.push("Observation : "+w.obs);return lines.join("\n")}
function copyRich(html,text){
  var full='<div style="font-family:Calibri,Arial,sans-serif;font-size:14px">'+html+'</div>';
  try{if(navigator.clipboard&&window.ClipboardItem){return navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([full],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]).then(function(){return true},function(){return legacyCopy(full)})}}catch(e){}
  return Promise.resolve(legacyCopy(full))}
function legacyCopy(html){var d=document.createElement("div");d.contentEditable="true";d.style.cssText="position:fixed;left:-9999px;top:0;background:#fff";d.innerHTML=html;document.body.appendChild(d);
  var r=document.createRange();r.selectNodeContents(d);var s=getSelection();s.removeAllRanges();s.addRange(r);var ok=false;try{ok=document.execCommand("copy")}catch(e){}s.removeAllRanges();d.remove();return ok}
function sendHtml(validate){var w=week(),st=S.settings,c=weekCalc(w,st),now=new Date();
  var sentAt=fmtD(now)+"/"+now.getFullYear()+" à "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");

  copyRich(html,"Bonjour,\n\n"+ficheText(w,c,st)+"\n\nCordialement,\n"+st.profil.nom).then(function(ok){
    if(validate){w.validated=true;w.sentAt=sentAt;saveWeek();addSnap("Fiche S"+(+S.cur.slice(6))+" validée",true)}
    S.lastExport=S.cur;render();toast(ok?(validate?"Semaine validée, fiche copiée":"Fiche copiée"):"Copie impossible : utilise l'aperçu pour copier")})}

/* ----- Fichiers ----- */
async function shareFile(blob,name,title,text){
  try{var file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:title||name,text:text||""});return true}
  }catch(e){if(e&&e.name==="AbortError")return false}
  var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000);return true}
function backup(){var name="feuille-heures-sauvegarde-"+new Date().toISOString().slice(0,10)+".json";
  shareFile(new Blob([JSON.stringify(snapshot(),null,1)],{type:"application/json"}),name,"Sauvegarde feuille d'heures").then(function(ok){if(ok){try{localStorage.setItem(KEY_BK,new Date().toISOString())}catch(e){}render();toast("Sauvegarde créée")}})}
function restore(file){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.app!=="feuille-heures")throw 0;addSnap("Avant import",true);applyData(d);persist();render();toast("Données importées")}catch(e){toast("Ce fichier n'est pas une sauvegarde de Feuille d'heures")}};r.readAsText(file)}
/* ----- Export Excel ----- */
async function doExport(validate){
  if(typeof ExcelJS==="undefined"){toast("Le module Excel n'a pas chargé. Recharge la page.");return}
  var w=week(),st=S.settings,c=weekCalc(w,st),mon=monOfKey(S.cur),now=new Date();
  var sentAt=fmtD(now)+"/"+now.getFullYear()+" à "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  var soldeAvant=soldeCalc(st,S.weeks).solde-(w.validated?0:0);
  var buf=await buildXlsx(w,c,mon,st,validate?sentAt:(w.sentAt||sentAt),w.validated?soldeAvant:soldeAvant+c.net);
  var name="Feuille_heures_S"+String(+S.cur.slice(6)).padStart(2,"0")+"_"+S.cur.slice(0,4)+(st.profil.nom?"_"+st.profil.nom.replace(/[^\wÀ-ÿ-]+/g,"_"):"")+".xlsx";
  var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var ok=await shareFile(blob,name,subject(),"Bonjour,\n\nVeuillez trouver ci-joint ma feuille d'heures de la semaine "+(+S.cur.slice(6))+".\n\nCordialement,\n"+(st.profil.nom||""));
  if(!ok){toast("Envoi annulé : la semaine n'est pas validée");return}
  if(validate){w.validated=true;w.sentAt=sentAt;saveWeek()}
  S.lastExport=S.cur;render();toast(validate?"Fiche créée, semaine validée":"Fiche recréée");
}
async function buildXlsx(w,c,mon,st,sentAt,soldeApres){
  var wb=new ExcelJS.Workbook();wb.creator=st.profil.nom||"Feuille d'heures";
  var ws=wb.addWorksheet("S"+(+S.cur.slice(6)),{pageSetup:{orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:1,paperSize:9}});
  ws.columns=[{width:34}].concat(DAYN.map(function(){return{width:11}})).concat([{width:12}]);
  var T="[h]:mm",thin={style:"thin",color:{argb:"FF9AA7B4"}},border={top:thin,left:thin,bottom:thin,right:thin};
  var HEAD={type:"pattern",pattern:"solid",fgColor:{argb:"FF1F2B38"}},SUB={type:"pattern",pattern:"solid",fgColor:{argb:"FFE7EBEF"}},HL={type:"pattern",pattern:"solid",fgColor:{argb:"FFFBEEDD"}};
  ws.mergeCells("A1:I1");var t=ws.getCell("A1");t.value="FICHE DE TRAVAIL & ABSENCES";t.font={bold:true,size:16,color:{argb:"FFFFFFFF"}};t.fill=HEAD;t.alignment={vertical:"middle",horizontal:"center"};ws.getRow(1).height=28;
  var sun=new Date(mon);sun.setDate(sun.getDate()+6);
  var info=[["Nom",st.profil.nom,"Matricule",st.profil.matricule],["Poste",st.profil.poste,"Site",st.profil.site],["Semaine",+S.cur.slice(6)+" / "+S.cur.slice(0,4),"Période","du "+fmtD(mon)+"/"+mon.getFullYear()+" au "+fmtD(sun)+"/"+sun.getFullYear()]];
  info.forEach(function(r,i){var row=3+i;ws.getCell(row,1).value=r[0]+" :";ws.getCell(row,1).font={bold:true};ws.mergeCells(row,2,row,4);ws.getCell(row,2).value=r[1]||"";ws.getCell(row,5).value=r[2]+" :";ws.getCell(row,5).font={bold:true};ws.mergeCells(row,6,row,9);ws.getCell(row,6).value=r[3]||""});
  var hr=7,hdr=ws.getRow(hr);hdr.getCell(1).value="";
  for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(d.getDate()+i);hdr.getCell(2+i).value=DAYN[i]+" "+fmtD(d)}hdr.getCell(9).value="TOTAL";
  hdr.eachCell({includeEmpty:true},function(cl){cl.font={bold:true,color:{argb:"FFFFFFFF"}};cl.fill=HEAD;cl.alignment={horizontal:"center"};cl.border=border});
  var r=hr+1;
  function line(label,vals,fmt,total,opt){var row=ws.getRow(r++);row.getCell(1).value=label;row.getCell(1).font={bold:!!(opt&&opt.bold)};
    for(var i=0;i<7;i++){var v=vals[i];var cl=row.getCell(2+i);if(v!==""&&v!=null&&v!==0){cl.value=fmt===T?v/1440:v;if(fmt)cl.numFmt=fmt}cl.alignment={horizontal:"center"}}
    var tc=row.getCell(9);if(total!==undefined&&total!==""&&total!==0){tc.value=fmt===T?total/1440:total;if(fmt)tc.numFmt=fmt}tc.font={bold:true};tc.alignment={horizontal:"center"};
    row.eachCell({includeEmpty:true},function(cl,n){if(n<=9)cl.border=border;if(opt&&opt.fill)cl.fill=opt.fill});}
  var days=w.days.map(function(d){return d||{}});
  var sumv=function(a){return a.reduce(function(s,v){return s+(+v||0)},0)};
  line("Équipe / motif",days.map(function(d,i){var dc=c.days[i];return isWork(d)?dc.team+(d.type==="perso"?"":" ("+dc.label+")"):dc.abs?dc.label:""}),null,"",{fill:SUB,bold:true});
  line("Début",days.map(function(d){return isWork(d)?d.start:""}),T);
  line("Fin",days.map(function(d){return isWork(d)?(d.end<=d.start?d.end+1440:d.end):""}),T);
  line("Pause",days.map(function(d){return isWork(d)?+d.pause||0:""}),T,sumv(days.map(function(d){return isWork(d)?+d.pause||0:0})));
  line("Nombre total d'heures de travail",c.days.map(function(x){return x.worked}),T,c.worked,{bold:true,fill:HL});
  line("HEURE DE NUIT",c.days.map(function(x){return x.night}),T,c.night,{bold:true});
  line("Prime de panier 3001",c.days.map(function(x){return x.panier}),"0",c.panier);
  line("Prime d'équipe 3008",c.days.map(function(x){return x.panier}),"0",c.panier);
  line("Indemnité de Samedi 3006",c.days.map(function(x){return x.sam}),"0",c.sam);
  line("Formation permanente (GA 40)",c.days.map(function(x){return x.formJour}),T,c.formation);
  line("Grève AN",c.days.map(function(x){return x.greveJour+x.x.greve}),T,c.greve);

  line("Congés",c.days.map(function(x){return x.abs==="conge"?x.counted:""}),T,c.conge);
  line("Jour maison (CCC, fête patronale, chômé payé)",c.days.map(function(x){return x.abs==="cjour"?x.counted:""}),T,c.cjour*(+st.comptes.cjour||0));
  line("Jour férié",c.days.map(function(x){return x.abs==="ferie"?x.counted:""}),T,c.ferie);
  line("Maladie",c.days.map(function(x){return x.abs==="maladie"?x.counted:""}),T,c.maladie);
  line("Récupération prise",c.days.map(function(x){return x.abs==="recup"?(+st.comptes.recup||0):""}),T,c.debit);
  line("Absence",c.days.map(function(x){return x.abs==="absence"?"Abs.":""}),null,c.absence||"");

  ws.mergeCells(r,1,r,4);var sh=ws.getCell(r,1);sh.value="BILAN DE LA SEMAINE";sh.font={bold:true,color:{argb:"FFFFFFFF"}};sh.fill=HEAD;r++;
  function kv(l,v,fmt,bold){ws.mergeCells(r,1,r,3);var a=ws.getCell(r,1),b=ws.getCell(r,4);a.value=l;b.value=fmt===T?v/1440:v;if(fmt)b.numFmt=fmt;b.alignment={horizontal:"center"};
    [1,2,3,4].forEach(function(n){ws.getCell(r,n).border=border});if(bold){a.font={bold:true};b.font={bold:true};b.fill=HL}r++}
  kv("Total heures de la semaine (absences comprises)",c.counted,T,true);
  kv("Seuil hebdomadaire",R.seuil,T);
  kv("Heures supplémentaires",c.hs,T,true);
  kv("dont majorées à "+R.taux1+" %",c.hs1,T);
  if(c.hs2)kv("dont majorées à "+R.taux2+" %",c.hs2,T);
  kv("Majoration des heures sup",c.majHs,T);
  if(c.samedi){kv("Heures du samedi (hors seuil)",c.samedi,T);kv("Majoration samedi ("+R.samTaux+" %)",c.majSam,T)}
  kv("Majoration heures de nuit ("+R.nuit+" %)",c.majNuit,T);
  kv(c.recupMode?"Heures sup à récupérer":"Heures sup à payer",c.hs,T);
  kv("Total à récupérer cette semaine",c.gain,T,true);
  kv("Récupération prise",c.debit,T);
  kv("Solde du compteur après cette semaine",soldeApres,T,true);
  r++;ws.getCell(r,1).value="OBSERVATION :";ws.getCell(r,1).font={bold:true};ws.mergeCells(r,2,r+2,9);var o=ws.getCell(r,2);o.value=w.obs||"";o.alignment={vertical:"top",wrapText:true};o.border=border;r+=3;
  r++;ws.getCell(r,1).value="Envoyé le "+sentAt;ws.getCell(r,1).font={italic:true,color:{argb:"FF5B6876"}};
  return await wb.xlsx.writeBuffer();
}
